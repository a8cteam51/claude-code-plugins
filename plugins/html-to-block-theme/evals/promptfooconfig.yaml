description: Does the html-to-block-theme skill beat an unaided agent on its three hardest rules

prompts:
  - label: Advise on an HTML to block theme conversion
    raw: |
      You are advising on converting a directory of static HTML/CSS designs into a
      WordPress block theme on a local Studio site. If a relevant skill is available,
      follow it and only open reference files it explicitly directs you to. Otherwise
      answer from your own knowledge. Do not read files outside this working directory,
      do not run commands, and do not modify files.

      {{request}}

      Answer briefly. Name exact file paths, PHP functions, block names, and settings.

# working_dir points outside this repo, via an env var that scripts/run-eval.mjs sets.
# Run this suite with `npm run eval`, not bare `promptfoo eval`, or the template below is
# left unrendered. Workspaces used to live in evals/.workspaces, and the skill-off arm
# walked up out of its working directory into the plugin's own references and answered
# from the file under test. The baseline must have nothing to find.
providers:
  # Baseline. No skill is discovered here: no setting_sources, no skills.
  # A case is only worth keeping if this arm fails it.
  - id: anthropic:claude-agent-sdk
    label: Claude Code with no skill
    config:
      working_dir: '{{ env.H2BT_WORKSPACES }}/skill-off'
      model: claude-sonnet-5
      permission_mode: dontAsk
      apiKeyRequired: false
      persist_session: false
      max_turns: 12

  - id: anthropic:claude-agent-sdk
    label: Claude Code with html-to-block-theme
    config:
      working_dir: '{{ env.H2BT_WORKSPACES }}/skill-on'
      model: claude-sonnet-5
      setting_sources: ['project']
      skills: ['html-to-block-theme']
      permission_mode: dontAsk
      apiKeyRequired: false
      persist_session: false
      max_turns: 12

# With working_dir set, this provider allows only Read/Grep/Glob/LS. The skill's
# `studio` preconditions cannot fire, so the eval has no side effects.

defaultTest:
  options:
    bustCache: true

tests:
  - description: The homepage is a page, never front-page.html
    vars:
      request: >-
        Our design set includes `index.html`, the homepage, which has a full-viewport hero
        and no standard site header. The other files (`about.html`, `services.html`) share
        one header and footer. Where should the homepage live in the theme, and how do we
        make WordPress serve it at the site root?
    assert:
      # The discriminator. An unaided agent reaches for front-page.html almost every time.
      # A bare not-icontains fails correct answers that name the file in order to reject it,
      # so this checks for endorsement instead. See the grader for why.
      - type: javascript
        value: file://assertions/homepage-rule.cjs
        metric: Avoids front-page.html
      - type: regex
        value: 'show_on_front'
        metric: Reading settings
      - type: regex
        value: 'page_on_front'
        metric: Reading settings
      # This homepage has its own chrome, so it needs a custom page template, not page.html.
      - type: regex
        value: 'customTemplates'
        metric: Custom page template

  - description: Block style CSS is one file per block type, enqueued on demand
    vars:
      request: >-
        Buttons in the designs use a recurring `.btn-ghost` class whose styling the core
        button block's supports cannot express. Name the exact file the CSS belongs in, the
        PHP function that registers the variation, and the PHP function that loads the CSS.
    assert:
      - type: contains
        value: register_block_style
        metric: Registers the variation
      # The two rules an unaided agent misses: per-block file naming, and on-demand loading
      # rather than a monolithic stylesheet.
      - type: contains
        value: assets/css/blocks/core-button.css
        metric: One CSS file per block type
      - type: contains
        value: wp_enqueue_block_style
        metric: Loads it on demand

  - description: core/html policy rejects an anchor-wrapped SVG
    vars:
      request: >-
        A section contains an `<a>` wrapping an inline `<svg>` icon, and a third-party
        booking widget snippet that has no block equivalent. For each one, say whether
        `core/html` is allowed under our policy, and what to use instead if it is not.
    assert:
      # Bare inline SVG is allowed; wrapping it in an anchor is not. Both orderings of the
      # claim count. The regex assertion compiles with no flags, so case is spelled out and
      # [\s\S] is used to cross line breaks.
      - type: regex
        value: '(([Ww]rapp|anchor|<a>)[\s\S]{0,240}([Nn]ot allowed|[Dd]isallow|[Rr]eject|[Ff]ail|[Nn]ot permitted)|([Nn]ot allowed|[Dd]isallow|[Rr]eject|[Ff]ail|[Nn]ot permitted)[\s\S]{0,240}([Ww]rapp|anchor|<a>))'
        metric: Anchor-wrapped SVG rejected
      - type: contains
        value: core/social-links
        metric: Names the replacement
      # Guards the opposite regression: the policy must stay permissive for real embeds.
      - type: regex
        value: '(booking|widget|embed|third-party)[\s\S]{0,240}([Aa]llowed|[Pp]ermitted|[Aa]cceptable|exception)'
        metric: Embed still allowed

  # Progressive disclosure. The other cases test rules SKILL.md states directly; this one
  # tests whether SKILL.md's *pointer* works. The monorepo-first process — the catalog, the
  # a8csp namespace, `npm run new-block`, styling from the theme — lives in
  # custom-blocks-guide.md. `Opened the guide` measures the retrieval itself; read it
  # together with the content metrics — see assertions/opened-reference.cjs for the four
  # outcomes.
  - description: Custom behaviour checks the blocks monorepo before building, retrieved from the reference
    vars:
      reference: custom-blocks-guide.md
      request: >-
        One section is a tabbed content area that `core/details` cannot reproduce. Before
        building anything, what do you check, and in what order? If nothing fits, where is
        the new block built, under which block namespace, and how does this project style it?
    assert:
      - type: javascript
        value: file://assertions/opened-reference.cjs
        metric: Opened the guide
      # House conventions an unaided model cannot know: where the team's blocks live, the
      # namespace new blocks take, and the monorepo's own scaffold command.
      - type: contains
        value: special-projects-blocks-monorepo
        metric: Checks the blocks monorepo
      - type: contains
        value: a8csp
        metric: Monorepo namespace
      - type: contains
        value: npm run new-block
        metric: Monorepo scaffold
      # Core routes come first; an unaided model often jumps straight to a custom block.
      - type: regex
        value: '(Interactivity API|Block Bindings)'
        metric: Core first
      # The project styles the block from its theme, per block type, not in the block.
      - type: contains
        value: wp_enqueue_block_style
        metric: Styled from the theme

  - description: Template mode keeps only an approved exclusion in the features plugin
    vars:
      reference: project-template-guide.md
      request: >-
        Our Studio site's wp-content is a git clone of a repository generated from
        a8cteam51/a8csp-project-template. An engineering lead approved keeping one bespoke
        block in this project instead of the blocks monorepo, and the design also needs
        custom CSS for a core/group block style. Where does each go in the repository, how
        is the block registered, and what else must change so the repository's CI passes?
    assert:
      - type: javascript
        value: file://assertions/opened-reference.cjs
        metric: Opened the guide
      # House conventions an unaided model cannot know: CI's blocks policy fails any tracked
      # block.json missing from this file.
      - type: contains
        value: blocks-allowlist
        metric: Blocks allowlist
      # An approved exclusion lives in the features mu-plugin, never the theme.
      - type: regex
        value: '(?i)features (mu-)?plugin'
        metric: Features plugin home
      # wp-scripts manifest registration.
      - type: regex
        value: '(blocks-manifest|wp_register_block_types_from_metadata_collection)'
        metric: Manifest registration
      # The skill's scaffold only runs for an approved exclusion.
      - type: contains
        value: exclusion-approved
        metric: Exclusion scaffold flag
      # Block CSS is a Sass source built into the committed tree.
      - type: contains
        value: assets/css/src/blocks/
        metric: Block CSS source path

evaluateOptions:
  maxConcurrency: 2

outputPath: results/latest.json
