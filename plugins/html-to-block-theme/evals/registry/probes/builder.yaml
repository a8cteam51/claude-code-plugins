    ```
  grade:
    - some_block: { name: core/group, attrs_match: '"backgroundColor":"primary"' }
    - markup_matches: 'has-primary-background-color'
    - markup_lacks: 'has-background-color-primary'
  pass_example: |
    <!-- wp:group {"backgroundColor":"primary","textColor":"base","style":{"spacing":{"padding":{"top":"var:preset|spacing|40","right":"var:preset|spacing|40","bottom":"var:preset|spacing|40","left":"var:preset|spacing|40"}}}} -->
    <div class="wp-block-group has-base-color has-primary-background-color has-text-color has-background" style="padding-top:var(--wp--preset--spacing--40);padding-right:var(--wp--preset--spacing--40);padding-bottom:var(--wp--preset--spacing--40);padding-left:var(--wp--preset--spacing--40)"><!-- wp:paragraph -->
    <p>Bookings reopen in March.</p>
