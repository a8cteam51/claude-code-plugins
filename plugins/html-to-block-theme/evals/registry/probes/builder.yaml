- id: accordion-is-details
  covers:
    - { file: mapping-guide.md, match: "An accordion is `core/accordion`" }
  consumer: builder
  task: |
    Convert this fragment of the design to block markup for the page's content. In the design, a script opens the answer under a question when it is clicked and closes whichever other answer was open. Reply with the block markup in one fenced code block, and anything else it depends on in further ones.

    ```html
    <div class="faq">
      <div class="faq-item"><button class="faq-q">How long does a project take?</button><div class="faq-a"><p>Six to ten weeks.</p></div></div>
      <div class="faq-item"><button class="faq-q">Do you work with in-house teams?</button><div class="faq-a"><p>Yes, most of the time.</p></div></div>
    </div>
    ```
  # Two right answers on WordPress 7.1: details blocks that share a name, which the browser
  # then opens one at a time, or the accordion block with autoclose. The name of a details
  # block is read from its HTML, so it is not in the delimiter.
  grade:
    - answer_lacks: '(?i)```(js|javascript)'
    - any_of:
        - - some_block: { name: core/details }
          - markup_lacks: '<details(?![^>]*\sname=)[^>]*>'
        - - some_block: { name: core/accordion, attrs_match: '"autoclose":true' }
  pass_example: |
    <!-- wp:details -->
    <details class="wp-block-details" name="faq"><summary>How long does a project take?</summary><!-- wp:paragraph -->
    <p>Six to ten weeks.</p>
    <!-- /wp:paragraph --></details>
    <!-- /wp:details -->

    <!-- wp:details -->
    <details class="wp-block-details" name="faq"><summary>Do you work with in-house teams?</summary><!-- wp:paragraph -->
    <p>Yes, most of the time.</p>
    <!-- /wp:paragraph --></details>
    <!-- /wp:details -->
  fail_example: |
    <!-- wp:details -->
    <details class="wp-block-details"><summary>How long does a project take?</summary><!-- wp:paragraph -->
    <p>Six to ten weeks.</p>
    <!-- /wp:paragraph --></details>
    <!-- /wp:details -->

