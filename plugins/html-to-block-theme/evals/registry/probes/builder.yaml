# Probes for rules the section builder meets while it writes markup.
#
# A probe is a small piece of real work, worded as the design would present it. It never
# names the rule it tests: a question that names its answer measures the question.
#
#   covers        the passages that state the rule, each by text that finds exactly one
#   consumer      whose context the rule lives in during a run (lib/context.mjs)
#   task          the message the model gets
#   grade         checks that must all hold (lib/graders.mjs)
#   pass_example  an answer the checks must accept
#   fail_example  the answer a model gives when it does not know the rule; must be rejected

- id: text-align-attribute
  covers:
    - { file: mapping-guide.md, match: "Read the block's `block.json`" }
  consumer: builder
  task: |
    Convert this fragment of the design to block markup for the page's content. Reply with the block markup in one fenced code block.

    ```html
    <p class="lede">Forty people, three time zones, one shared way of working.</p>
    ```

    ```css
    .lede { text-align: center; }
    ```
  grade:
    - some_block: { name: core/paragraph, attrs_match: '"typography":\{[^}]*"textAlign":"center"' }
    - no_block: { name: core/paragraph, attrs_match: '"align":"center"' }
  pass_example: |
    <!-- wp:paragraph {"style":{"typography":{"textAlign":"center"}}} -->
    <p class="has-text-align-center">Forty people, three time zones, one shared way of working.</p>
    <!-- /wp:paragraph -->
  fail_example: |
    <!-- wp:paragraph {"align":"center"} -->
    <p class="has-text-align-center">Forty people, three time zones, one shared way of working.</p>
    <!-- /wp:paragraph -->

