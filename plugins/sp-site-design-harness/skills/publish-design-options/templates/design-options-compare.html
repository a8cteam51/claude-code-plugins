<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT}} — {{TITLE_LOWER}} side by side</title>
<meta name="description" content="Every {{TITLE_LOWER}} for {{PROJECT}}, side by side.">
<meta name="robots" content="noindex, nofollow">
<style>
  /* Companion to design-options-index.html (the deck template). Same tokens, type, and wordmark,
     so the comparison reads as the last slide of the same deck whatever the directions look like. */
  :root{
    --blue:#2e72f5;
    --ink:#101010;
    --paper:#fff;
    --rule:#e2e2e2;
    --quiet:#6b6b6b;
    --well:#f4f4f4;
    --grotesk:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
    --rail:clamp(1.5rem,5vw,4.5rem);
    --gap:clamp(1rem,2.2vw,2rem);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--grotesk);font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:.75rem 1rem;z-index:10}
  .skip:focus{left:0}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px}

  /* ---- Cover band: the deck cover, cut down to a header ---- */
  .cover{background:var(--blue);color:#fff;padding:var(--rail) var(--rail) clamp(1.5rem,4vh,2.5rem)}
  .cover :focus-visible{outline-color:#fff}
  .mark__logo{display:block;height:clamp(18px,1.9vw,26px);width:auto}
  .cover__mid{
    display:flex;flex-wrap:wrap;gap:1.5rem 2rem;align-items:end;justify-content:space-between;
    padding-block:clamp(2.5rem,7vh,5rem) clamp(1.5rem,4vh,2.5rem);
  }
  .cover h1{
    margin:0;
    font-size:clamp(3rem,9vw,8.5rem);
    line-height:.86;letter-spacing:-.045em;font-weight:500;
  }
  .cover p{
    margin:clamp(.75rem,2vh,1.5rem) 0 0;max-width:44ch;
    font-size:clamp(1.05rem,1.8vw,1.5rem);
    line-height:1.25;letter-spacing:-.015em;font-weight:500;
    color:rgba(255,255,255,.92);
  }
  .cover p.cover__lede{margin-top:.5rem;font-size:clamp(.95rem,1.2vw,1.1rem);line-height:1.4;letter-spacing:0;font-weight:400;color:rgba(255,255,255,.85)}
  .sync{
    display:inline-flex;align-items:center;gap:.65rem;min-height:44px;padding:0 1.15rem;
    border:1px solid rgba(255,255,255,.6);border-radius:999px;background:none;color:#fff;
    font:inherit;font-weight:500;cursor:pointer;
  }
  .sync__dot{width:.8rem;height:.8rem;border-radius:50%;border:2px solid #fff}
  .sync[aria-pressed="true"] .sync__dot{background:#fff}
  .sync:hover{background:rgba(255,255,255,.12)}
  .sync[hidden]{display:none}
  /* ---- Footer rail: three parts, per the deck template ---- */
  .rail{
    display:grid;gap:1rem .75rem;
    grid-template-columns:repeat(3,1fr);align-items:end;
    font-size:clamp(.75rem,1.05vw,.875rem);line-height:1.5;font-weight:500;
    color:rgba(255,255,255,.88);
  }
  .rail>:nth-child(2){text-align:center}
  .rail>:nth-child(3){text-align:right}

  /* ---- Columns: one per direction, two to four ---- */
  .grid{
    counter-reset:opt;--cols:3;
    display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap);
    padding:clamp(2rem,6vh,3.5rem) var(--rail) clamp(2.5rem,7vh,5rem);
  }
  .grid[data-count="2"]{--cols:2}
  .grid[data-count="4"]{--cols:4}
  .col{counter-increment:opt;display:flex;flex-direction:column;min-width:0}
  .col__head{
    display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;align-items:baseline;
    padding-bottom:1rem;border-top:1px solid var(--rule);padding-top:1rem;
  }
  .col__head::before{
    content:counter(opt);
    font-size:clamp(1.75rem,2.8vw,2.75rem);line-height:.9;letter-spacing:-.04em;font-weight:500;
  }
  .col h2{margin:0;font-size:clamp(1.75rem,2.8vw,2.75rem);line-height:.95;letter-spacing:-.045em;font-weight:500}
  .col__note{grid-column:2;margin:.4rem 0 0;max-width:46ch;font-size:clamp(.9rem,1.1vw,1rem);line-height:1.4;color:var(--quiet);min-height:2.8em}
  .win{
    height:calc(100vh - 12rem);height:calc(100svh - 12rem);min-height:22rem;
    overflow-y:auto;overscroll-behavior:contain;
    border:1px solid var(--rule);background:var(--well);
  }
  .win img{display:block;width:100%;height:auto}
  .col__open{
    align-self:flex-start;display:inline-flex;align-items:center;gap:.5rem;min-height:44px;margin-top:.5rem;
    font-weight:500;text-decoration:none;border-bottom:1px solid currentColor;line-height:1.2;
  }
  @media (hover:hover){.col__open:hover{color:var(--blue)}}
  .back{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:44px;
    margin:0 var(--rail) clamp(2.5rem,7vh,5rem);padding:clamp(1rem,2.5vh,1.5rem) 0;
    border-top:1px solid var(--rule);text-decoration:none;
    font-size:clamp(1.1rem,2vw,1.5rem);font-weight:500;letter-spacing:-.02em;
  }
  .back span{font-size:.8125rem;letter-spacing:0;color:var(--quiet)}
  @media (hover:hover){.back:hover{color:var(--blue)}}

  /* Four columns get cramped below a wide desktop: two by two instead */
  @media (max-width:80rem){.grid[data-count="4"]{--cols:2}}
  @media (max-width:48rem){
    .grid[data-count]{--cols:1;gap:3rem}
    .win{height:75vh;min-height:0}
    .col__note{min-height:0}
  }
  @media (max-width:40rem){
    .rail{grid-template-columns:1fr}
    .rail>:nth-child(2),.rail>:nth-child(3){text-align:left}
  }
  @media print{.win{height:auto;overflow:visible}.sync{display:none}}
</style>
</head>
<body>

<a class="skip" href="#directions">Skip to the {{NOUN}}</a>

<header class="cover">

    </svg>
  </div>
  <div class="cover__mid">
    <div>
      <h1>Side&nbsp;by&nbsp;side</h1>
      <p>{{PROJECT}}</p>
      <p class="cover__lede">The full Home page of every option. Scroll one and the others follow, so you can compare the same section.</p>
    </div>
    <button class="sync" type="button" aria-pressed="true"><span class="sync__dot" aria-hidden="true"></span>Scroll together</button>
  </div>
  <div class="rail">
    <div>Automattic<br>Special Projects</div>
    <div>{{VERSION}}<br>{{DATE}}</div>
    <div>{{COUNT}} {{NOUN}}<br>Open any to review</div>
  </div>
</header>

<main id="directions" class="grid" data-count="{{COUNT}}">
{{COLUMNS}}
</main>

<a class="back" href="index.html">Back to the contents <span>All {{COUNT}} {{NOUN}}</span></a>

<script>
(() => {
  'use strict';
  const wins = [...document.querySelectorAll('.win')];
  const btn = document.querySelector('.sync');
  const stacked = matchMedia('(max-width:48rem)');
  let lead = null, release = 0;
  const together = () => btn.getAttribute('aria-pressed') === 'true' && !stacked.matches;
  btn.addEventListener('click', () => btn.setAttribute('aria-pressed', String(btn.getAttribute('aria-pressed') !== 'true')));
  /* Follow by proportion: the pages are different lengths, so the same fraction lands near the same section. */
  wins.forEach(w => w.addEventListener('scroll', () => {
    if (!together() || (lead && lead !== w)) return;
    lead = w; clearTimeout(release); release = setTimeout(() => { lead = null; }, 160);
    const f = w.scrollTop / Math.max(1, w.scrollHeight - w.clientHeight);
    wins.forEach(o => { if (o !== w) o.scrollTop = f * (o.scrollHeight - o.clientHeight); });
  }, {passive: true}));
  const hide = () => { btn.hidden = stacked.matches; };
  stacked.addEventListener('change', hide); hide();
})();
</script>
</body>
</html>
