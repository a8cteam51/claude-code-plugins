- id: per-viewport-padding
  covers:
    - { file: mapping-guide.md, match: "on a block instance take any style subtree" }
  consumer: builder
  task: |
    Convert this fragment of the design to block markup for the page's content. Reply with the block markup in one fenced code block, and any CSS it depends on in a second one.

    ```html
    <section class="band"><p>Built for the long run.</p></section>
    ```

    ```css
    .band { padding-top: 96px; }
    @media (max-width: 1023px) { .band { padding-top: 64px; } }
    @media (max-width: 767px) { .band { padding-top: 24px; } }
    ```
  grade:
    - some_block: { name: core/group, attrs_match: ['"@mobile":\{.*"padding"', '"@tablet":\{.*"padding"'] }
    - render: { css_matches: ['width <= 767px\)[^@]*padding-top', '767px < width <= 1023px\)[^@]*padding-top'] }
  pass_example: |
    <!-- wp:group {"tagName":"section","style":{"spacing":{"padding":{"top":"var:preset|spacing|80"}},"@tablet":{"spacing":{"padding":{"top":"var:preset|spacing|60"}}},"@mobile":{"spacing":{"padding":{"top":"var:preset|spacing|40"}}}}} -->
    <section class="wp-block-group" style="padding-top:var(--wp--preset--spacing--80)"><!-- wp:paragraph -->
    <p>Built for the long run.</p>
    <!-- /wp:paragraph --></section>
    <!-- /wp:group -->
  fail_example: |
    ```html
    <!-- wp:group {"tagName":"section","className":"is-style-band","style":{"spacing":{"padding":{"top":"var:preset|spacing|80"}}}} -->
    <section class="wp-block-group is-style-band" style="padding-top:var(--wp--preset--spacing--80)"><!-- wp:paragraph -->
    <p>Built for the long run.</p>
    <!-- /wp:paragraph --></section>
    <!-- /wp:group -->
    ```

    ```css
    @media (max-width: 1023px) { .is-style-band { padding-top: 64px !important; } }
    ```

